<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Yeivily" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Yeivily</title>
  <defs>
    <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="gBeak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="60" cy="62" r="54" fill="#38bdf8" opacity="0.07"/>
  <!-- Stem of the Y -->
  <polygon points="42,58 54,58 54,106 42,106" fill="#0369a1"/>
  <polygon points="54,58 66,58 66,106 54,106" fill="#2563eb"/>
  <!-- Left arm (wing) -->
  <polygon points="42,58 54,58 32,14 10,14" fill="url(#gLeft)"/>
  <polygon points="10,14 32,14 37,24" fill="#ffffff" opacity="0.22"/>
  <!-- Right arm (neck) and head -->
  <polygon points="54,58 66,58 88,28 76,20" fill="url(#gRight)"/>
  <polygon points="70,22 90,6 104,22 86,38" fill="#818cf8"/>
  <polygon points="87,22 104,22 86,38" fill="#4338ca"/>
  <!-- Beak -->
  <polygon points="100,14 118,22 100,30" fill="url(#gBeak)" filter="url(#glow)"/>
  <!-- Eye -->
  <circle cx="85" cy="20" r="6" fill="#ffffff"/>
  <circle cx="86" cy="20.4" r="3" fill="#0f172a"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
