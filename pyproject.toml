[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yeivily"
version = "1.0.1"
description = "Tiny, keyless, Tavily-style search server and MCP provider backed by DuckDuckGo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yeib" }]
keywords = ["tavily", "mcp", "duckduckgo", "search", "ollama", "goose", "local-llm"]
dependencies = [
    "ddgs>=8.0.0",
]

[project.scripts]
yeivily = "yeivily:main"
yeivily-mcp = "yeivily_mcp:main"

[project.urls]
Homepage = "https://github.com/yeib/yeivily"
Repository = "https://github.com/yeib/yeivily"
Issues = "https://github.com/yeib/yeivily/issues"

[tool.setuptools]
py-modules = ["yeivily", "yeivily_mcp"]
